name: cricket_stream_finder
description: "Free cricket streaming app using iptv-org streams"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # NOT better_player: 0.0.84's Android module is AGP-4-era (no `namespace`)
  # and cannot configure under this project's AGP 9.0.1. The maintained fork
  # ships build.gradle.kts with a namespace and Media3, same Dart API.
  better_player_plus: ^1.4.1
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  cached_network_image: ^3.3.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/