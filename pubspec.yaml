name: cricket_stream_finder
description: "Free cricket streaming app using iptv-org streams"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # media_kit: native libmpv player. Replaces better_player_plus (broken
  # controls, weak quality/track switching, no stall recovery).
  media_kit: ^1.1.11
  media_kit_libs_video: ^1.0.5
  media_kit_video: ^1.2.5
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  cached_network_image: ^3.3.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/